# Configuración de nfpm para generar .deb, .rpm y .pkg.tar.zst (Arch) con build-packages.sh.
# build-packages.sh sustituye @STAGE@ y @RELEASE@ y genera build/nfpm.yaml.
name: ireport
arch: amd64
platform: linux
version: 5.6.0
release: "@RELEASE@"
section: devel
priority: optional
maintainer: "axelroman-dev <https://github.com/axelroman-dev>"
description: |
  iReport 5.6.0 (diseñador de reportes JasperReports) con JDK 7 embebido.
  Se ejecuta en un servidor X11 aislado mediante Xpra para funcionar en Wayland.
  Proyecto no oficial, sin afiliación con Jaspersoft/TIBCO.
vendor: "ireport-linux (no oficial)"
homepage: https://github.com/axelroman-dev/ireport-linux
license: AGPL-3.0-only AND MIT AND GPL-2.0-only WITH Classpath-exception-2.0

contents:
  - src: @STAGE@/app
    dst: /opt/ireport-5.6.0
    type: tree
  - src: /opt/ireport-5.6.0/ireport-x11.sh
    dst: /usr/bin/ireport
    type: symlink
  - src: @STAGE@/ireport.desktop
    dst: /usr/share/applications/ireport.desktop
  - src: @STAGE@/ireport.png
    dst: /usr/share/icons/hicolor/48x48/apps/ireport.png

overrides:
  deb:
    depends: [xpra, xvfb, xauth]
    recommends: [x11-utils]
  rpm:
    depends: [xpra, xorg-x11-server-Xvfb, xorg-x11-xauth]
    recommends: [xdpyinfo]
  archlinux:
    depends: [xpra, xorg-server-xvfb, xorg-xauth, xorg-xdpyinfo]

rpm:
  group: Development/Tools
  compression: zstd
deb:
  compression: zstd
